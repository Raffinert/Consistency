name: Release candidate verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore Raffinert.Relations.sln
      - run: dotnet build Raffinert.Relations.sln -c Release --no-restore
      - run: dotnet test tests/Raffinert.Relations.Tests/Raffinert.Relations.Tests.csproj -c Release -f net8.0 --no-build
      - run: dotnet test tests/Raffinert.Relations.Tests/Raffinert.Relations.Tests.csproj -c Release -f net10.0 --no-build
      - run: dotnet test tests/Raffinert.Relations.EntityFrameworkCore.Tests/Raffinert.Relations.EntityFrameworkCore.Tests.csproj -c Release -f net10.0 --no-build
      - run: dotnet format Raffinert.Relations.sln --no-restore --verify-no-changes
      - run: dotnet pack Raffinert.Relations.sln -c Release --no-build -o artifacts/packages
      - name: Validate package payloads
        shell: pwsh
        run: |
          $packages = Get-ChildItem artifacts/packages/*.nupkg | Where-Object { $_.Name -notlike '*.snupkg' }
          if ($packages.Count -ne 2) { throw "Expected two NuGet packages." }
          if ((Get-ChildItem artifacts/packages/*.snupkg).Count -ne 2) { throw "Expected two symbol packages." }
          foreach ($package in $packages) {
            $entries = [IO.Compression.ZipFile]::OpenRead($package.FullName).Entries.FullName
            if (-not ($entries -match '^README.md$')) { throw "$($package.Name) has no README." }
            if (-not ($entries -match '^CHANGELOG.md$')) { throw "$($package.Name) has no changelog." }
          }
      - name: Smoke test packed packages
        run: |
          PACKAGE_SOURCE="$GITHUB_WORKSPACE/artifacts/packages"
          for project in CoreNet8 CoreNet10 EfNet10; do
            dotnet restore "tests/package-consumers/$project" --source https://api.nuget.org/v3/index.json --source "$PACKAGE_SOURCE"
            dotnet run --project "tests/package-consumers/$project" -c Release --no-restore
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
