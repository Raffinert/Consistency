name: Release candidate verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore Raffinert.Consistency.sln
      - run: dotnet build Raffinert.Consistency.sln -c Release --no-restore
      - run: dotnet test tests/Raffinert.Consistency.Tests/Raffinert.Consistency.Tests.csproj -c Release -f net8.0 --no-build
      - run: dotnet test tests/Raffinert.Consistency.Tests/Raffinert.Consistency.Tests.csproj -c Release -f net10.0 --no-build
      - run: dotnet test tests/Raffinert.Consistency.EntityFrameworkCore.Tests/Raffinert.Consistency.EntityFrameworkCore.Tests.csproj -c Release -f net10.0 --no-build
      - run: dotnet run --project samples/Raffinert.Consistency.OrderFulfillmentSample/Raffinert.Consistency.OrderFulfillmentSample.csproj -c Release --no-build
      - run: dotnet run --project samples/Raffinert.Consistency.EntityFrameworkCore.Sample/Raffinert.Consistency.EntityFrameworkCore.Sample.csproj -c Release --no-build
      - run: dotnet run --project samples/Raffinert.Consistency.DependencyMaintenanceSample/Raffinert.Consistency.DependencyMaintenanceSample.csproj -c Release --no-build
      - run: dotnet format Raffinert.Consistency.sln --no-restore --verify-no-changes
      - run: dotnet pack Raffinert.Consistency.sln -c Release --no-build -o artifacts/packages
      - name: Validate release version, API baselines, and package payloads
        shell: pwsh
        run: ./eng/VerifyReleaseCandidate.ps1 -PackageDirectory artifacts/packages -RequireEmptyUnshipped
      - name: Restore packed package consumers
        run: |
          PACKAGE_SOURCE="$GITHUB_WORKSPACE/artifacts/packages"
          for project in CoreNet8 CoreNet10 EfNet10; do
            dotnet restore "tests/package-consumers/$project" --source https://api.nuget.org/v3/index.json --source "$PACKAGE_SOURCE"
          done
      - name: Verify packed consumer package versions
        shell: pwsh
        run: ./eng/VerifyPackageConsumerAssets.ps1
      - name: Smoke test packed packages
        run: |
          for project in CoreNet8 CoreNet10 EfNet10; do
            dotnet run --project "tests/package-consumers/$project" -c Release --no-restore
          done
      # Prerelease publication remains an intentional manual action; this workflow only uploads verification artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
