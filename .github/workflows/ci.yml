name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Raffinert.Relations.sln
      - name: Build
        run: dotnet build Raffinert.Relations.sln -c Release --no-restore
      - name: Test
        run: dotnet test Raffinert.Relations.sln -c Release --no-build
      - name: Verify formatting
        run: dotnet format Raffinert.Relations.sln --no-restore --verify-no-changes
      - name: Pack
        run: dotnet pack Raffinert.Relations.sln -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: NuGet-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
